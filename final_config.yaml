selection_and_statistics:
  no_selection_on_test: every frozen model is evaluated and reported; no model, threshold, route or setting is chosen or changed
    after the test scores are seen
  primary_metrics:
    cls:
    - BSS (vs climatology of the training rows)
    reg:
    - MAE
    - MSESS (vs climatology)
    secondary:
    - ROC-AUC
    - PR-AUC
    - CSI at the frozen threshold
    - ECE
    - RMSE
    - bias
    - wet-day MAE
    - heavy-rain recall/precision >= 20/50 mm
    - skill vs seasonal+persistence
    - per-year and monsoon scores
  headline_models_fixed_in_advance:
    rule: best 5-fold development CV score among the frozen classical models on the primary metric
    cls: lightgbm (dev BSS 0.2650)
    reg_MAE: catboost_tweedie (dev MAE 6.897)
    reg_MSESS: hurdle_catboost_log_msess (dev MSESS 0.275; mean-type forecast)
  forecast_used_in_tests: seed-mean forecast of each model (probability / mm); per-seed scores reported as mean +- std
  comparisons:
    family_A: every frozen model vs seasonal+persistence
    family_B: 'every frozen model vs the headline classical reference: cls Brier vs lightgbm; reg absolute error vs catboost_tweedie;
      reg squared error vs hurdle_catboost_log_msess'
  losses:
    cls: Brier (squared probability error)
    reg:
    - absolute error (MAE)
    - squared error (MSE)
  diebold_mariano: two-sided DM test on the daily loss differential; HAC variance with Bartlett kernel, bandwidth floor(4
    (n/100)^(2/9)) (Newey-West 1994); Harvey-Leybourne-Newbold small-sample correction (h = 1), Student-t with n-1 df (final_eval.dm_test)
  multiplicity: Holm step-down within each family x task x loss at alpha = 0.05 (final_eval.holm)
  bootstrap: paired moving-calendar-month block bootstrap of the target date (whole year-month blocks), 1,000 resamples, seed
    42, 95 % percentile CIs for dBSS, dMAE, dMSESS (metrics.block_bootstrap)
  rule_11_triggers: BSS > 0.45, monsoon ROC-AUC > 0.90 (1 mm target), MSESS > 0.60 -> investigate before reporting
  secondary_robustness: the frozen PRECTOTCORR forecasts are also scored against IMERG_PRECTOT observed rain on the test days
    (no refit; tests the reanalysis self-consistency caveat)
